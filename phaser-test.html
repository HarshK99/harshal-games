  // Phaser's loader refuses data-URI images when the page itself is opened via file://
  // (a guard against an old Chrome bug), so we decode them ourselves with plain
  // <img> elements first and hand Phaser finished HTMLImageElements instead.
  function loadImageElements(sprites) {
    const keys = Object.keys(sprites);
    return Promise.all(keys.map(key => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve([key, img]);
      img.onerror = () => reject(new Error('Failed to decode sprite: ' + key));
      img.src = sprites[key];
    }))).then(pairs => Object.fromEntries(pairs));
  }

  class MainScene extends Phaser.Scene {
    constructor(images) {
      super('main');
      this.spriteImages = images;
    }

    preload() {
      Object.entries(this.spriteImages).forEach(([key, img]) => this.textures.addImage(key, img));

      const g = this.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0xffd76a, 1);
      g.fillCircle(4, 4, 4);
      g.generateTexture('bullet', 8, 8);
      g.destroy();
    }

    create() {
      this.physics.world.setBounds(0, 0, WORLD, WORLD);
      this.cameras.main.setBounds(0, 0, WORLD, WORLD);

      this.add.tileSprite(WORLD / 2, WORLD / 2, WORLD, WORLD, 'grass');

      this.player = this.physics.add.sprite(WORLD / 2, WORLD / 2, 'manBlue');
      this.player.setScale(1.6);
      this.player.setCollideWorldBounds(true);
      this.player.setDamping(true);
      this.player.setDrag(0.85);
      this.player.setMaxVelocity(260);

      // Buildings: brick blocks you can hide behind. Taller ones (more floors) are bigger.
      this.blocks = this.add.group();
      for (let i = 0; i < 16; i++) {
        const x = 150 + Math.random() * (WORLD - 300);
        const y = 150 + Math.random() * (WORLD - 300);
        if (Phaser.Math.Distance.Between(x, y, WORLD / 2, WORLD / 2) < 220) continue;

        const floors = 1 + Math.floor(Math.random() * 4);
        const w = 90 + floors * 22;
        const h = 90 + floors * 22;

        const b = this.add.tileSprite(x, y, w, h, 'brick');
        this.physics.add.existing(b, true);
        b.floors = floors;
        this.blocks.add(b);
      }
      this.physics.add.collider(this.player, this.blocks);

      // A few target dummies to test shooting against
      this.enemies = this.physics.add.group();
      for (let i = 0; i < 6; i++) {
        let ex, ey, tries = 0;
        do {
          ex = 200 + Math.random() * (WORLD - 400);
          ey = 200 + Math.random() * (WORLD - 400);
          tries++;
        } while (Phaser.Math.Distance.Between(ex, ey, WORLD / 2, WORLD / 2) < 260 && tries < 20);

        const skin = ENEMY_SKINS[i % ENEMY_SKINS.length];
        const en = this.enemies.create(ex, ey, skin);
        en.setScale(1.6);
        en.setCollideWorldBounds(true);
        en.hp = 60;
        en.maxHp = 60;
        en.hpBarBg = this.add.rectangle(ex, ey - 30, 34, 5, 0x2c2c66);
        en.hpBar = this.add.rectangle(ex, ey - 30, 34, 5, 0xf06a6a);
      }
      this.physics.add.collider(this.enemies, this.blocks);

      // Bullets
      this.bullets = this.physics.add.group();
      this.physics.add.collider(this.bullets, this.blocks, (bullet) => bullet.destroy());
      this.physics.add.overlap(this.bullets, this.enemies, (bullet, enemy) => {
        bullet.destroy();
        enemy.hp -= 20;
        if (enemy.hp <= 0) {
          enemy.hpBarBg.destroy();
          enemy.hpBar.destroy();
          enemy.destroy();
        } else {
          enemy.hpBar.width = 34 * (enemy.hp / enemy.maxHp);
        }
      });

      this.aimGraphics = this.add.graphics();

      this.lastFired = 0;
      this.input.on('pointerdown', () => this.tryFire());

      this.cameras.main.startFollow(this.player, true, 0.12, 0.12);

      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys('W,A,S,D');

      this.hud = this.add.text(10, 10, '', { fontFamily: 'Segoe UI, sans-serif', fontSize: '13px', color: '#e8e6ff' });
      this.hud.setScrollFactor(0);
    }

    tryFire() {
      if (this.time.now - this.lastFired < 180) return;
      this.lastFired = this.time.now;

      const pointer = this.input.activePointer;
      const angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, pointer.worldX, pointer.worldY);
      const bullet = this.bullets.create(
        this.player.x + Math.cos(angle) * 20,
        this.player.y + Math.sin(angle) * 20,
        'bullet'
      );
      this.physics.velocityFromRotation(angle, 600, bullet.body.velocity);
      this.time.delayedCall(1500, () => { if (bullet.active) bullet.destroy(); });
    }

    update() {
      const speed = 900;
      let ax = 0, ay = 0;

      if (this.cursors.left.isDown || this.keys.A.isDown) ax = -1;
      else if (this.cursors.right.isDown || this.keys.D.isDown) ax = 1;

      if (this.cursors.up.isDown || this.keys.W.isDown) ay = -1;
      else if (this.cursors.down.isDown || this.keys.S.isDown) ay = 1;

      const len = Math.hypot(ax, ay) || 1;
      this.player.setAcceleration((ax / len) * speed, (ay / len) * speed);

      if (this.input.activePointer.isDown) this.tryFire();

      const pointer = this.input.activePointer;
      const aimAngle = Phaser.Math.Angle.Between(this.player.x, this.player.y, pointer.worldX, pointer.worldY);
      this.player.setRotation(aimAngle + Math.PI / 2);

      this.aimGraphics.clear();
      this.aimGraphics.lineStyle(2, 0xcfcfe6, 0.6);
      this.aimGraphics.lineBetween(this.player.x, this.player.y, pointer.worldX, pointer.worldY);

      this.enemies.children.iterate(en => {
        if (!en || !en.active) return;
        en.hpBarBg.setPosition(en.x, en.y - 30);
        en.hpBar.setPosition(en.x - (34 - en.hpBar.width) / 2, en.y - 30);
      });

      this.hud.setText(
        `Position: ${Math.round(this.player.x)}, ${Math.round(this.player.y)}\n` +
        `Enemies left: ${this.enemies.countActive()}`
      );
    }
  }

  loadImageElements(SPRITES).then(images => {
    new Phaser.Game({
      type: Phaser.AUTO,
      width: VIEW_W,
      height: VIEW_H,
      parent: 'stage',
      backgroundColor: '#0b1030',
      physics: { default: 'arcade', arcade: { debug: false } },
      scene: new MainScene(images)
    });
  });
</script>
</body>
</html>
