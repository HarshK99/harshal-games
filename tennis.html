<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis vs Computer</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #10142f 0%, #07081a 60%, #04040f 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8e6ff;
    padding: 20px 16px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 26px;
    text-align: center;
  }

  .sub {
    font-size: 13px;
    color: #9c9bd6;
    margin-bottom: 16px;
    text-align: center;
  }

  .score {
    display: flex;
    gap: 40px;
    font-size: 18px;
    margin-bottom: 12px;
    text-align: center;
  }

  .score .you { color: #6af0a0; }
  .score .cpu { color: #f06a6a; }
  .score .name { display: block; font-size: 12.5px; color: #9c9bd6; font-weight: normal; }

  .stage {
    position: relative;
  }

  canvas {
    background: #0b1030;
    border: 2px solid #2c2c66;
    border-radius: 12px;
    max-width: 100%;
    touch-action: none;
    display: block;
  }

  .picker {
    position: absolute;
    inset: 0;
    background: rgba(4, 4, 15, 0.92);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .picker h2 {
    margin: 0;
    font-size: 18px;
  }

  .pick-row {
    display: flex;
    gap: 18px;
  }

  .pick-btn {
    background: linear-gradient(160deg, #171b3d 0%, #0f1128 100%);
    border: 2px solid #2c2c66;
    border-radius: 14px;
    padding: 16px 22px;
    color: #e8e6ff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .pick-btn:hover {
    border-color: #6a3ff0;
    transform: translateY(-2px);
  }

  .pick-btn .emoji { font-size: 32px; }

  .msg {
    margin-top: 14px;
    font-size: 16px;
    min-height: 24px;
    color: #ffd76a;
    text-align: center;
  }

  .controls {
    margin-top: 10px;
    font-size: 12.5px;
    color: #9c9bd6;
    text-align: center;
  }

  button.action {
    margin-top: 14px;
    background: linear-gradient(160deg, #6a3ff0 0%, #4a2ac0 100%);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }

  a.back {
    margin-top: 18px;
    color: #9c9bd6;
    font-size: 12.5px;
    text-decoration: none;
  }
</style>
</head>
<body>
  <h1>🎾 Tennis vs Computer</h1>
  <div class="sub">First to 5 points wins the match</div>

  <div class="score">
    <div class="you">You: <span id="youScore">0</span><span class="name" id="youName"></span></div>
    <div class="cpu">Computer: <span id="cpuScore">0</span><span class="name" id="cpuName"></span></div>
  </div>

  <div class="stage">
    <canvas id="game" width="600" height="360"></canvas>
    <div class="picker" id="picker">
      <h2>Choose your character</h2>
      <div class="pick-row">
        <button class="pick-btn" data-gender="boy">
          <span class="emoji">👦</span>
          Boy
        </button>
        <button class="pick-btn" data-gender="girl">
          <span class="emoji">👧</span>
          Girl
        </button>
      </div>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <button class="action" id="restartBtn" style="display:none;">Play Again</button>

  <div class="controls">Move your paddle: ↑ / ↓ arrow keys, or W / S. On phone, drag on the canvas.</div>
  <a class="back" href="index.html">&larr; Back to games</a>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const PADDLE_W = 22, PADDLE_H = 74;
  const WIN_SCORE = 5;

  const BOY_NAMES = ['Alex', 'Sam', 'Leo', 'Max', 'Jack'];
  const GIRL_NAMES = ['Mia', 'Zoe', 'Ava', 'Ella', 'Ruby'];

  let youY = H / 2 - PADDLE_H / 2;
  let cpuY = H / 2 - PADDLE_H / 2;
  let ball = { x: W / 2, y: H / 2, vx: 4, vy: 3, r: 8 };

  let youScore = 0, cpuScore = 0;
  let gameOver = false;
  let gameStarted = false;
  let keys = {};

  let you = { gender: 'boy', name: 'You', color: '#6af0a0', swing: 0 };
  let cpu = { gender: 'boy', name: 'Computer', color: '#f06a6a', swing: 0 };

  document.addEventListener('keydown', e => { keys[e.key] = true; });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  canvas.addEventListener('pointermove', e => {
    if (e.buttons === 0 && e.pointerType !== 'touch') return;
    const rect = canvas.getBoundingClientRect();
    const scaleY = H / rect.height;
    const y = (e.clientY - rect.top) * scaleY;
    youY = Math.min(H - PADDLE_H, Math.max(0, y - PADDLE_H / 2));
  });

  document.querySelectorAll('.pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const gender = btn.dataset.gender;
      you.gender = gender;
      you.name = gender === 'boy' ? 'You' : 'You';
      you.color = '#6af0a0';

      const cpuGender = Math.random() > 0.5 ? 'boy' : 'girl';
      cpu.gender = cpuGender;
      const pool = cpuGender === 'boy' ? BOY_NAMES : GIRL_NAMES;
      cpu.name = pool[Math.floor(Math.random() * pool.length)];
      cpu.color = '#f06a6a';

      document.getElementById('youName').textContent = gender === 'boy' ? '(Boy)' : '(Girl)';
      document.getElementById('cpuName').textContent = `${cpu.name} (${cpuGender === 'boy' ? 'Boy' : 'Girl'})`;

      document.getElementById('picker').style.display = 'none';
      gameStarted = true;
    });
  });

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    ball.vx = 4 * direction;
    ball.vy = (Math.random() * 4 - 2) || 3;
  }

  function update() {
    if (!gameStarted || gameOver) return;

    if (keys['ArrowUp'] || keys['w'] || keys['W']) youY -= 6;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) youY += 6;
    youY = Math.min(H - PADDLE_H, Math.max(0, youY));

    const cpuCenter = cpuY + PADDLE_H / 2;
    const targetY = ball.y;
    const cpuSpeed = 4.2;
    if (cpuCenter < targetY - 10) cpuY += cpuSpeed;
    else if (cpuCenter > targetY + 10) cpuY -= cpuSpeed;
    cpuY = Math.min(H - PADDLE_H, Math.max(0, cpuY));

    if (you.swing > 0) you.swing--;
    if (cpu.swing > 0) cpu.swing--;

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy *= -1; }

    if (ball.x - ball.r < 20 + PADDLE_W &&
        ball.y > youY && ball.y < youY + PADDLE_H &&
        ball.vx < 0) {
      ball.x = 20 + PADDLE_W + ball.r;
      ball.vx *= -1.05;
      const hitPos = (ball.y - (youY + PADDLE_H / 2)) / (PADDLE_H / 2);
      ball.vy = hitPos * 5;
      you.swing = 12;
    }

    if (ball.x + ball.r > W - 20 - PADDLE_W &&
        ball.y > cpuY && ball.y < cpuY + PADDLE_H &&
        ball.vx > 0) {
      ball.x = W - 20 - PADDLE_W - ball.r;
      ball.vx *= -1.05;
      const hitPos = (ball.y - (cpuY + PADDLE_H / 2)) / (PADDLE_H / 2);
      ball.vy = hitPos * 5;
      cpu.swing = 12;
    }

    if (ball.x < 0) {
      cpuScore++;
      updateScore();
      if (cpuScore >= WIN_SCORE) endGame(false);
      else resetBall(1);
    }

    if (ball.x > W) {
      youScore++;
      updateScore();
      if (youScore >= WIN_SCORE) endGame(true);
      else resetBall(-1);
    }
  }

  function updateScore() {
    document.getElementById('youScore').textContent = youScore;
    document.getElementById('cpuScore').textContent = cpuScore;
  }

  function endGame(youWon) {
    gameOver = true;
    document.getElementById('msg').textContent = youWon ? `🏆 You beat ${cpu.name}!` : `💻 ${cpu.name} wins the match!`;
    document.getElementById('restartBtn').style.display = 'inline-block';
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    youScore = 0; cpuScore = 0; gameOver = false;
    updateScore();
    document.getElementById('msg').textContent = '';
    document.getElementById('restartBtn').style.display = 'none';
    youY = H / 2 - PADDLE_H / 2;
    cpuY = H / 2 - PADDLE_H / 2;
    resetBall(Math.random() > 0.5 ? 1 : -1);
  });

  // Draws a simple cartoon character standing where the paddle is.
  // facing: 1 = racket arm points right (player on left), -1 = points left (cpu on right)
  function drawCharacter(x, y, w, h, player, facing) {
    const cx = x + w / 2;
    const headR = w / 2 + 2;
    const headCy = y + headR;
    const bodyTop = headCy + headR - 4;
    const bodyBottom = y + h;

    // body
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.roundRect(x, bodyTop, w, bodyBottom - bodyTop, 8);
    ctx.fill();

    // head
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath();
    ctx.arc(cx, headCy, headR, 0, Math.PI * 2);
    ctx.fill();

    // hair
    ctx.fillStyle = '#3a2a1a';
    if (player.gender === 'boy') {
      ctx.beginPath();
      ctx.arc(cx, headCy - headR * 0.3, headR * 0.95, Math.PI, 0);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(cx, headCy - headR * 0.2, headR * 1.0, Math.PI, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - headR * 0.9, headCy + headR * 0.4, headR * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx + headR * 0.9, headCy + headR * 0.4, headR * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // racket: swings out toward the ball, rests close to body otherwise
    const swingT = player.swing / 12;
    const reach = 8 + swingT * 16;
    const handY = bodyTop + (bodyBottom - bodyTop) * 0.45;
    const handX = cx + facing * (w / 2 + reach);

    ctx.strokeStyle = '#cfcfe6';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx + facing * (w / 2), handY);
    ctx.lineTo(handX, handY);
    ctx.stroke();

    ctx.strokeStyle = '#ffe08a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(handX + facing * 8, handY, 9, 12, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = '#2c2c66';
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    drawCharacter(20, youY, PADDLE_W, PADDLE_H, you, 1);
    drawCharacter(W - 20 - PADDLE_W, cpuY, PADDLE_W, PADDLE_H, cpu, -1);

    ctx.fillStyle = '#ffd76a';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resetBall(Math.random() > 0.5 ? 1 : -1);
  updateScore();
  loop();
</script>
</body>
</html>
