<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gesture Detector — MVP Test</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #0d3320 0%, #071c14 60%, #04100b 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e4fff0;
    padding: 30px 16px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    background: linear-gradient(160deg, #123522 0%, #0c2418 100%);
    border: 1px solid #2c6644;
    border-radius: 20px;
    box-shadow: 0 0 0 1px rgba(92, 255, 157, 0.15), 0 20px 60px rgba(0,0,0,0.6);
    padding: 24px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    text-align: center;
  }

  .sub {
    text-align: center;
    font-size: 12.5px;
    color: #96d6ab;
    margin-bottom: 18px;
  }

  .cam-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #04100b;
    border: 2px solid #2c6644;
    border-radius: 14px;
    overflow: hidden;
  }

  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
  }

  video { visibility: hidden; }

  .status {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: #d9fff4;
    opacity: 0.8;
    min-height: 18px;
  }

  .readout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 18px 0;
  }

  .readout .label {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #96d6ab;
  }

  .readout .value {
    width: 84px;
    height: 84px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 900;
    background: #102518;
    border: 2px solid #2c6644;
    color: #a0ffbf;
    transition: all 0.15s ease;
  }

  .readout .value.locked {
    border-color: #4dff8a;
    box-shadow: 0 0 20px rgba(77, 255, 138, 0.6);
    color: #fff;
  }

  .legend {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }

  .legend div {
    background: #102518;
    border: 1px solid #2c6644;
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
    font-size: 11.5px;
    color: #96d6ab;
  }

  .legend div b {
    display: block;
    font-size: 16px;
    color: #a0ffbf;
    margin-bottom: 2px;
  }

  .start-btn {
    display: block;
    margin: 4px auto 0;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #06210f;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(180deg, #7dffa8 0%, #34d874 45%, #1f9e57 100%);
    box-shadow: 0 6px 0 #146b3a, 0 10px 18px rgba(0,0,0,0.45);
  }

  .start-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #146b3a, 0 4px 10px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>

  <div class="wrap">
    <h1>Gesture Detector — MVP Test</h1>
    <div class="sub">Isolated test bed before wiring into Hand Cricket</div>

    <button class="start-btn" id="startBtn">Enable Camera</button>

    <div class="cam-box">
      <video class="input_video" playsinline></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="status" id="status">Click "Enable Camera" to start</div>

    <div class="readout">
      <div class="label">Detected</div>
      <div class="value" id="valueBox">–</div>
    </div>

    <div class="legend">
      <div><b>1</b>Index</div>
      <div><b>2</b>Index+Mid</div>
      <div><b>3</b>+Ring</div>
      <div><b>4</b>+Pinky</div>
      <div><b>5</b>Open palm</div>
      <div><b>6</b>Thumbs up</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');
    const valueBox = document.getElementById('valueBox');
    const startBtn = document.getElementById('startBtn');

    let history = [];
    const HISTORY_SIZE = 8;
    const LOCK_THRESHOLD = 6;

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function isFingerUp(tip, pip, mcp) {
      return tip.y < pip.y && pip.y < mcp.y;
    }

    function detectGesture(lm) {
      const wrist = lm[0];
      const thumbTip = lm[4], thumbIp = lm[3];
      const indexTip = lm[8], indexPip = lm[6], indexMcp = lm[5];
      const middleTip = lm[12], middlePip = lm[10], middleMcp = lm[9];
      const ringTip = lm[16], ringPip = lm[14], ringMcp = lm[13];
      const pinkyTip = lm[20], pinkyPip = lm[18], pinkyMcp = lm[17];

      const indexUp = isFingerUp(indexTip, indexPip, indexMcp);
      const middleUp = isFingerUp(middleTip, middlePip, middleMcp);
      const ringUp = isFingerUp(ringTip, ringPip, ringMcp);
      const pinkyUp = isFingerUp(pinkyTip, pinkyPip, pinkyMcp);
      const fingersUp = [indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

      const thumbSpread = dist(thumbTip, pinkyMcp) > dist(thumbIp, pinkyMcp) * 1.1;

      const fingersCurled =
        fingersUp === 0 &&
        indexTip.y > indexPip.y &&
        middleTip.y > middlePip.y &&
        ringTip.y > ringPip.y &&
        pinkyTip.y > pinkyPip.y;

      const thumbPointingUp =
        thumbTip.y < wrist.y - 0.05 &&
        thumbTip.y < indexMcp.y &&
        thumbTip.y < pinkyMcp.y;

      if (fingersCurled && thumbPointingUp) return 6;
      if (fingersUp === 4 && thumbSpread) return 5;
      if (fingersUp >= 1 && fingersUp <= 4) return fingersUp;
      return null;
    }

    function pushHistory(val) {
      history.push(val);
      if (history.length > HISTORY_SIZE) history.shift();
    }

    function stableValue() {
      const counts = {};
      history.forEach(v => {
        if (v === null) return;
        counts[v] = (counts[v] || 0) + 1;
      });
      let best = null, bestCount = 0;
      for (const k in counts) {
        if (counts[k] > bestCount) { best = Number(k); bestCount = counts[k]; }
      }
      return { value: best, count: bestCount };
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, { color: '#4dff8a', lineWidth: 3 });
        drawLandmarks(canvasCtx, lm, { color: '#ffffff', lineWidth: 1, radius: 3 });

        const gesture = detectGesture(lm);
        pushHistory(gesture);
        const { value, count } = stableValue();

        if (value !== null) {
          valueBox.textContent = value;
          if (count >= LOCK_THRESHOLD) {
            valueBox.classList.add('locked');
            statusEl.textContent = 'Locked — steady gesture detected';
          } else {
            valueBox.classList.remove('locked');
            statusEl.textContent = 'Reading...';
          }
        } else {
          valueBox.textContent = '–';
          valueBox.classList.remove('locked');
          statusEl.textContent = 'Hand detected, no clear gesture';
        }
      } else {
        pushHistory(null);
        valueBox.textContent = '–';
        valueBox.classList.remove('locked');
        statusEl.textContent = 'No hand detected';
      }

      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    let camera = null;

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Starting...';
      statusEl.textContent = 'Requesting camera access...';
      try {
        camera = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        await camera.start();
        startBtn.textContent = 'Camera Running';
        statusEl.textContent = 'Show a gesture to the camera';
      } catch (err) {
        statusEl.textContent = 'Camera access failed: ' + err.message;
        startBtn.disabled = false;
        startBtn.textContent = 'Enable Camera';
      }
    });
  </script>
</body>
</html>
