<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Cricket — Harshal Jain</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #0d3320 0%, #071c14 60%, #04100b 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e4fff0;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: linear-gradient(160deg, #123522 0%, #0c2418 100%);
    border: 1px solid #2c6644;
    border-radius: 20px;
    box-shadow: 0 0 0 1px rgba(92, 255, 157, 0.15),
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(60, 220, 120, 0.15);
    overflow: hidden;
  }

  .banner {
    position: relative;
    padding: 22px 32px 16px;
    background: linear-gradient(135deg, #1f6b3a 0%, #2c9152 50%, #3ab26e 100%);
    text-align: center;
  }

  .banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 2px,
      transparent 2px,
      transparent 12px
    );
  }

  .banner h1 {
    position: relative;
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 12px rgba(200, 255, 220, 0.6), 0 2px 4px rgba(0,0,0,0.4);
  }

  .banner .sub {
    position: relative;
    margin-top: 4px;
    font-size: 12.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d9fff4;
    opacity: 0.85;
  }

  .body {
    padding: 26px 30px 30px;
  }

  .status {
    text-align: center;
    font-size: 14px;
    color: #a0ffbf;
    font-weight: 700;
    letter-spacing: 0.5px;
    min-height: 20px;
    margin-bottom: 18px;
  }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 22px;
  }

  .score-box {
    background: #102518;
    border: 1px solid #2c6644;
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }

  .score-box .lbl {
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #96d6ab;
    margin-bottom: 6px;
  }

  .score-box .num {
    font-size: 28px;
    font-weight: 900;
    color: #a0ffbf;
    text-shadow: 0 0 10px rgba(160, 255, 191, 0.5);
    font-variant-numeric: tabular-nums;
  }

  .target {
    text-align: center;
    font-size: 12.5px;
    color: #cdbfff0;
    color: #d9fff4;
    opacity: 0.8;
    margin: -12px 0 20px;
    min-height: 16px;
  }

  .prompt {
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #d9fff4;
    opacity: 0.75;
    margin-bottom: 12px;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .num-btn {
    font-family: inherit;
    font-size: 22px;
    font-weight: 900;
    color: #06210f;
    padding: 18px 0;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(180deg, #7dffa8 0%, #34d874 45%, #1f9e57 100%);
    box-shadow:
      0 6px 0 #146b3a,
      0 10px 18px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transform: translateY(0);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
  }

  .num-btn:hover { filter: brightness(1.08); }

  .num-btn:active {
    transform: translateY(6px);
    box-shadow:
      0 0 0 #146b3a,
      0 4px 10px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .num-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    filter: none;
  }

  .duel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 4px 0 20px;
    min-height: 60px;
  }

  .duel .pick {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    background: #142418;
    border: 2px solid #2c6644;
    color: #a0ffbf;
  }

  .duel .vs {
    font-size: 12px;
    letter-spacing: 2px;
    color: #96d6ab;
    text-transform: uppercase;
  }

  .duel .vs.counting {
    font-size: 34px;
    font-weight: 900;
    color: #a0ffbf;
    text-shadow: 0 0 12px rgba(160, 255, 191, 0.7);
    letter-spacing: 0;
  }

  .action-row {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }

  .toss-btn, .again-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #06210f;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(180deg, #ffe08a 0%, #ffb703 45%, #d99000 100%);
    box-shadow:
      0 5px 0 #8a5a00,
      0 8px 16px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .toss-btn:active, .again-btn:active {
    transform: translateY(5px);
    box-shadow: 0 0 0 #8a5a00, 0 3px 8px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  .choice-row {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .result-banner {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 18px;
  }

  .result-banner.win {
    background: rgba(77, 255, 138, 0.12);
    color: #a0ffbf;
    text-shadow: 0 0 12px rgba(160, 255, 191, 0.6);
    border: 1px solid #2c6644;
  }

  .result-banner.lose {
    background: rgba(255, 77, 77, 0.12);
    color: #ffb3b3;
    text-shadow: 0 0 12px rgba(255, 77, 77, 0.6);
    border: 1px solid #6b1f1f;
  }

  .hidden { display: none !important; }

  .cam-toggle-row {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }

  .cam-toggle-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #a0ffbf;
    background: #102518;
    border: 1px solid #2c6644;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }

  .cam-toggle-btn:hover { border-color: #4dff8a; }
  .cam-toggle-btn:disabled { opacity: 0.5; cursor: default; }

  .cam-panel {
    margin-bottom: 20px;
  }

  .cam-box {
    position: relative;
    width: 220px;
    aspect-ratio: 4 / 3;
    margin: 0 auto;
    background: #04100b;
    border: 2px solid #2c6644;
    border-radius: 12px;
    overflow: hidden;
  }

  .cam-box video, .cam-box canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
  }

  .cam-box video { visibility: hidden; }

  .cam-reading {
    text-align: center;
    font-size: 13px;
    color: #96d6ab;
    margin-top: 8px;
  }

  .cam-reading b {
    color: #a0ffbf;
    font-size: 15px;
  }

  .cam-reading.locked b {
    color: #fff;
    text-shadow: 0 0 10px rgba(160, 255, 191, 0.7);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="banner">
      <h1>Hand Cricket</h1>
      <div class="sub">Harshal Jain vs Computer</div>
      <a href="hello.html" style="position:relative;display:inline-block;margin-top:10px;font-size:11px;letter-spacing:1px;color:#06210f;background:#fff;opacity:0.85;padding:4px 10px;border-radius:999px;text-decoration:none;font-weight:700;">&larr; Character Sheet</a>
    </div>

    <div class="body">
      <div class="status" id="status">Choose bat or bowl to start</div>
      <div class="target" id="target"></div>
      <div id="resultBanner"></div>

      <div class="scoreboard">
        <div class="score-box">
          <div class="lbl" id="p1Label">You</div>
          <div class="num" id="p1Score">0</div>
        </div>
        <div class="score-box">
          <div class="lbl" id="p2Label">Computer</div>
          <div class="num" id="p2Score">0</div>
        </div>
      </div>

      <div class="duel" id="duel">
        <div class="pick" id="yourPick">?</div>
        <div class="vs" id="vsTimer">vs</div>
        <div class="pick" id="cpuPick">?</div>
      </div>

      <div class="cam-toggle-row">
        <button class="cam-toggle-btn" id="camToggleBtn">Enable Gesture Mode</button>
      </div>

      <div class="cam-panel hidden" id="camPanel">
        <div class="cam-box">
          <video class="input_video" playsinline></video>
          <canvas class="output_canvas" width="320" height="240"></canvas>
        </div>
        <div class="cam-reading" id="camReading">Show a gesture...</div>
      </div>

      <div id="tossArea" class="action-row">
        <div class="choice-row">
          <button class="toss-btn" id="batBtn">Bat First</button>
          <button class="toss-btn" id="bowlBtn">Bowl First</button>
        </div>
      </div>

      <div id="playArea" class="hidden">
        <div class="prompt" id="padPrompt">Pick a number</div>
        <div class="pad" id="pad">
          <button class="num-btn" data-n="1">1</button>
          <button class="num-btn" data-n="2">2</button>
          <button class="num-btn" data-n="3">3</button>
          <button class="num-btn" data-n="4">4</button>
          <button class="num-btn" data-n="5">5</button>
          <button class="num-btn" data-n="6">6</button>
        </div>
      </div>

      <div id="againArea" class="action-row hidden">
        <button class="again-btn" id="againBtn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    const statusEl = document.getElementById('status');
    const targetEl = document.getElementById('target');
    const resultBanner = document.getElementById('resultBanner');
    const p1Label = document.getElementById('p1Label');
    const p2Label = document.getElementById('p2Label');
    const p1ScoreEl = document.getElementById('p1Score');
    const p2ScoreEl = document.getElementById('p2Score');
    const yourPickEl = document.getElementById('yourPick');
    const cpuPickEl = document.getElementById('cpuPick');
    const vsTimerEl = document.getElementById('vsTimer');
    const tossArea = document.getElementById('tossArea');
    const playArea = document.getElementById('playArea');
    const againArea = document.getElementById('againArea');
    const pad = document.getElementById('pad');
    const padPrompt = document.getElementById('padPrompt');
    const batBtn = document.getElementById('batBtn');
    const bowlBtn = document.getElementById('bowlBtn');
    const againBtn = document.getElementById('againBtn');
    const camToggleBtn = document.getElementById('camToggleBtn');
    const camPanel = document.getElementById('camPanel');
    const camReading = document.getElementById('camReading');
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // --- Gesture detection (MediaPipe Hands) ---
    let gestureEnabled = false;
    let gestureHistory = [];
    const GESTURE_HISTORY_SIZE = 8;
    const GESTURE_LOCK_THRESHOLD = 5;

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function isFingerUp(tip, pip, mcp) {
      return tip.y < pip.y && pip.y < mcp.y;
    }

    function detectGesture(lm) {
      const wrist = lm[0];
      const thumbTip = lm[4], thumbIp = lm[3];
      const indexTip = lm[8], indexPip = lm[6], indexMcp = lm[5];
      const middleTip = lm[12], middlePip = lm[10], middleMcp = lm[9];
      const ringTip = lm[16], ringPip = lm[14], ringMcp = lm[13];
      const pinkyTip = lm[20], pinkyPip = lm[18], pinkyMcp = lm[17];

      const indexUp = isFingerUp(indexTip, indexPip, indexMcp);
      const middleUp = isFingerUp(middleTip, middlePip, middleMcp);
      const ringUp = isFingerUp(ringTip, ringPip, ringMcp);
      const pinkyUp = isFingerUp(pinkyTip, pinkyPip, pinkyMcp);
      const fingersUp = [indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

      const thumbSpread = dist(thumbTip, pinkyMcp) > dist(thumbIp, pinkyMcp) * 1.1;

      const fingersCurled =
        fingersUp === 0 &&
        indexTip.y > indexPip.y &&
        middleTip.y > middlePip.y &&
        ringTip.y > ringPip.y &&
        pinkyTip.y > pinkyPip.y;

      const thumbPointingUp =
        thumbTip.y < wrist.y - 0.05 &&
        thumbTip.y < indexMcp.y &&
        thumbTip.y < pinkyMcp.y;

      if (fingersCurled && thumbPointingUp) return 6;
      if (fingersUp === 4 && thumbSpread) return 5;
      if (fingersUp >= 1 && fingersUp <= 4) return fingersUp;
      return null;
    }

    function pushGestureHistory(val) {
      gestureHistory.push(val);
      if (gestureHistory.length > GESTURE_HISTORY_SIZE) gestureHistory.shift();
    }

    function stableGesture() {
      const counts = {};
      gestureHistory.forEach(v => {
        if (v === null) return;
        counts[v] = (counts[v] || 0) + 1;
      });
      let best = null, bestCount = 0;
      for (const k in counts) {
        if (counts[k] > bestCount) { best = Number(k); bestCount = counts[k]; }
      }
      return { value: best, count: bestCount };
    }

    function onHandResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, { color: '#4dff8a', lineWidth: 2 });
        drawLandmarks(canvasCtx, lm, { color: '#ffffff', lineWidth: 1, radius: 2 });
        pushGestureHistory(detectGesture(lm));
      } else {
        pushGestureHistory(null);
      }

      canvasCtx.restore();

      const { value, count } = stableGesture();
      if (value !== null) {
        const locked = count >= GESTURE_LOCK_THRESHOLD;
        camReading.innerHTML = `Reading: <b>${value}</b>`;
        camReading.classList.toggle('locked', locked);
      } else {
        camReading.textContent = 'Show a gesture...';
        camReading.classList.remove('locked');
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onHandResults);

    let camera = null;

    camToggleBtn.addEventListener('click', async () => {
      camToggleBtn.disabled = true;
      camToggleBtn.textContent = 'Starting camera...';
      try {
        camera = new Camera(videoElement, {
          onFrame: async () => { await hands.send({ image: videoElement }); },
          width: 320,
          height: 240
        });
        await camera.start();
        camPanel.classList.remove('hidden');
        camToggleBtn.textContent = 'Gesture Mode: ON';
        gestureEnabled = true;
        pad.classList.add('hidden');
        padPrompt.classList.add('hidden');
      } catch (err) {
        camToggleBtn.disabled = false;
        camToggleBtn.textContent = 'Enable Gesture Mode';
        statusEl.textContent = 'Camera access failed — using tap controls';
      }
    });

    let youBatFirst = true;
    let innings = 1;
    let target = null;
    let scores = { you: 0, cpu: 0 };
    let batting = 'you';

    function resetGame() {
      innings = 1;
      target = null;
      scores = { you: 0, cpu: 0 };
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      p1Label.textContent = 'You';
      p2Label.textContent = 'Computer';
      yourPickEl.textContent = '?';
      cpuPickEl.textContent = '?';
      vsTimerEl.textContent = 'vs';
      vsTimerEl.classList.remove('counting');
      targetEl.textContent = '';
      resultBanner.innerHTML = '';
      statusEl.textContent = 'Choose bat or bowl to start';
      tossArea.classList.remove('hidden');
      playArea.classList.add('hidden');
      againArea.classList.add('hidden');
    }

    function startInnings1(userBats) {
      youBatFirst = userBats;
      batting = userBats ? 'you' : 'cpu';
      tossArea.classList.add('hidden');
      playArea.classList.remove('hidden');
      statusEl.textContent = userBats ? 'Innings 1 — You are batting' : 'Innings 1 — Computer is batting';
      startRoundCountdown();
    }

    function startRoundCountdown() {
      Array.from(pad.children).forEach(b => b.disabled = true);
      yourPickEl.textContent = '?';
      cpuPickEl.textContent = '?';
      gestureHistory = [];
      runCountdown(3, () => {
        if (gestureEnabled) {
          statusEl.textContent = `${currentBattingLabel()} batting — show your gesture now`;
          gestureHistory = [];
          waitForGesture(3000, play, () => {
            statusEl.textContent = `${currentBattingLabel()} batting — no gesture detected, try again`;
            startRoundCountdown();
          });
          return;
        }
        Array.from(pad.children).forEach(b => b.disabled = false);
        statusEl.textContent = `${currentBattingLabel()} batting — pick a number`;
      });
    }

    function waitForGesture(maxMs, onFound, onTimeout) {
      const deadline = Date.now() + maxMs;
      const poll = () => {
        const { value } = stableGesture();
        if (value !== null) {
          onFound(value);
          return;
        }
        if (Date.now() >= deadline) {
          onTimeout();
          return;
        }
        setTimeout(poll, 150);
      };
      poll();
    }

    function scheduleNextRound() {
      setTimeout(startRoundCountdown, 2000);
    }

    function currentBattingLabel() {
      return batting === 'you' ? 'You' : 'Computer';
    }

    function currentScoreEl() {
      return batting === 'you' ? p1ScoreEl : p2ScoreEl;
    }

    function addRuns(n) {
      scores[batting] += n;
      currentScoreEl().textContent = scores[batting];
    }

    function play(n) {
      Array.from(pad.children).forEach(b => b.disabled = true);
      yourPickEl.textContent = n;
      resolveRound(n);
    }

    function runCountdown(seconds, onDone) {
      vsTimerEl.textContent = seconds;
      vsTimerEl.classList.add('counting');

      const tick = () => {
        seconds -= 1;
        if (seconds <= 0) {
          vsTimerEl.textContent = 'vs';
          vsTimerEl.classList.remove('counting');
          onDone();
          return;
        }
        vsTimerEl.textContent = seconds;
        setTimeout(tick, 1000);
      };

      setTimeout(tick, 1000);
    }

    function resolveRound(n) {
      const cpuN = Math.floor(Math.random() * 6) + 1;
      cpuPickEl.textContent = cpuN;

      const out = n === cpuN;

      if (out) {
        endInnings();
        return;
      }

      // Runs come from whichever side is batting: your number if you're
      // batting, the computer's number if the computer is batting.
      const runsValue = batting === 'you' ? n : cpuN;
      addRuns(runsValue);

      if (innings === 2) {
        if (batting === 'you' && scores.you > target) { finishGame(); return; }
        if (batting === 'cpu' && scores.cpu > target) { finishGame(); return; }
      }

      statusEl.textContent = `${currentBattingLabel()} batting — matched? no, +${runsValue} run${runsValue > 1 ? 's' : ''}`;
      scheduleNextRound();
    }

    function endInnings() {
      if (innings === 1) {
        target = scores[batting];
        innings = 2;
        batting = batting === 'you' ? 'cpu' : 'you';
        targetEl.textContent = `Target: ${target + 1} runs`;
        statusEl.textContent = `Out! Innings 2 — ${currentBattingLabel()} needs ${target + 1} to win`;
        scheduleNextRound();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      Array.from(pad.children).forEach(b => b.disabled = true);
      playArea.classList.add('hidden');
      againArea.classList.remove('hidden');

      const youWin = scores.you > scores.cpu;
      const tie = scores.you === scores.cpu;

      let msg, cls;
      if (tie) {
        msg = `Match Tied! ${scores.you} - ${scores.cpu}`;
        cls = 'win';
      } else if (youWin) {
        msg = `You Win! ${scores.you} - ${scores.cpu}`;
        cls = 'win';
      } else {
        msg = `Computer Wins! ${scores.cpu} - ${scores.you}`;
        cls = 'lose';
      }

      resultBanner.innerHTML = `<div class="result-banner ${cls}">${msg}</div>`;
      statusEl.textContent = 'Match over';
    }

    batBtn.addEventListener('click', () => startInnings1(true));
    bowlBtn.addEventListener('click', () => startInnings1(false));
    againBtn.addEventListener('click', resetGame);

    pad.addEventListener('click', (e) => {
      const btn = e.target.closest('.num-btn');
      if (!btn || btn.disabled) return;
      play(parseInt(btn.dataset.n, 10));
    });
  </script>
</body>
