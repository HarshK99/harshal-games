<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Collection — Harshal Games App</title>
<script src="components/premium-card.js" defer></script>
<script src="components/trading-card.js" defer></script>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #10142f 0%, #07081a 60%, #04040f 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8e6ff;
    padding: 48px 16px 64px;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin: 0 0 6px;
  }

  .sub {
    text-align: center;
    font-size: 13px;
    color: #9c9bd6;
    margin-bottom: 40px;
  }

  .back {
    display: block;
    text-align: center;
    font-size: 12.5px;
    color: #a0ffbf;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    margin-bottom: 28px;
  }

  .back:hover { border-color: #a0ffbf; }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
  }

  .grid a {
    display: block;
    text-decoration: none;
    color: inherit;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Card Collection</h1>
    <div class="sub">Every build in the app, collected as a card. Hover to feel it — click to play.</div>
    <a class="back" href="index.html">&larr; Back to hub</a>

    <div class="grid">
      <premium-card>
        <a href="hello.html">
          <trading-card
            theme="grass"
            name="Harshal Jain"
            subtitle="All-Rounder · Fast Bowler"
            hp="88"
            icon="🏏"
            level="Man of the Match"
            move1-name="Yorker"
            move1-power="88"
            move2-name="Cover Drive"
            move2-power="75"
            flavor="Genuine pace, late swing, and a bat that can finish games."
            footer="Tap to view sheet"
          ></trading-card>
        </a>
      </premium-card>

      <premium-card>
        <a href="hand-cricket.html">
          <trading-card
            theme="water"
            name="Hand Cricket"
            subtitle="Classic · vs Computer"
            hp="60"
            icon="✋"
            level="Best of 2 Innings"
            move1-name="Gesture Throw"
            move1-power="72"
            move2-name="Quick Tap"
            move2-power="65"
            flavor="Play by tapping numbers or with live hand-gesture detection."
            footer="Tap to play"
          ></trading-card>
        </a>
      </premium-card>

      <premium-card>
        <a href="air-draw.html">
          <trading-card
            theme="psychic"
            name="Circle Challenge"
            subtitle="Air Draw · 2 Players"
            hp="50"
            icon="⭕"
            level="3 Tries Each"
            move1-name="Steady Hand"
            move1-power="80"
            move2-name="Roundness"
            move2-power="70"
            flavor="Draw a circle in the air with your finger — scored on roundness."
            footer="Tap to play"
          ></trading-card>
        </a>
      </premium-card>

      <premium-card>
        <a href="tennis.html">
          <trading-card
            theme="electric"
            name="Tennis"
            subtitle="Arcade · vs Computer"
            hp="55"
            icon="🎾"
            level="First to 5"
            move1-name="Fast Rally"
            move1-power="78"
            move2-name="Reflexes"
            move2-power="82"
            flavor="Move your paddle with the arrow keys and race to 5 points."
            footer="Tap to play"
          ></trading-card>
        </a>
      </premium-card>

      <premium-card>
        <a href="shooter.html">
          <trading-card
            theme="fire"
            name="Arena Shooter"
            subtitle="BGMI-style · Top-Down"
            hp="100"
            icon="🔫"
            level="Chicken Dinner"
            move1-name="Wave Clear"
            move1-power="85"
            move2-name="Survival"
            move2-power="90"
            flavor="Survive waves of enemies in a top-down arena shootout."
            footer="Tap to play"
          ></trading-card>
        </a>
      </premium-card>

      <premium-card>
        <a href="squad.html">
          <trading-card
            theme="fighting"
            name="Squad Royale"
            subtitle="5v5v5 · Battle Royale"
            hp="100"
            icon="🪂"
            level="Shrinking Zone"
            move1-name="Squad Push"
            move1-power="88"
            move2-name="Spectate"
            move2-power="60"
            flavor="Multi-floor buildings, a shrinking zone, and squads of five."
            footer="Tap to play"
          ></trading-card>
        </a>
      </premium-card>
    </div>
  </div>
</body>
</html>
